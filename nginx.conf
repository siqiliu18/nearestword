events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream api {
        server server:8080;
    }

    server {
        listen 80;
        server_name nearestword.dev www.nearestword.dev;

        # Serve frontend static files directly
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy API and health requests to Go server
        location /api/ {
            proxy_pass         http://api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /health {
            proxy_pass http://api;
        }

        # TLS block goes here after Certbot runs on DigitalOcean:
        # listen 443 ssl;
        # ssl_certificate     /etc/letsencrypt/live/nearestword.dev/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/nearestword.dev/privkey.pem;
    }
}
