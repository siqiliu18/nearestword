events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream api {
        server server:8080;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name nearestword.dev www.nearestword.dev;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name nearestword.dev www.nearestword.dev;

        ssl_certificate     /etc/letsencrypt/live/nearestword.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nearestword.dev/privkey.pem;

        location / {
            proxy_pass         http://api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }
}
