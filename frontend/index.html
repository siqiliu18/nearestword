<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nearestword</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 48px 24px;
    }

    header {
      max-width: 860px;
      margin: 0 auto 40px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 6px;
      color: #666;
      font-size: 0.95rem;
    }

    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 24px;
      max-width: 860px;
      margin: 0 auto 24px;
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 0.78rem; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.4px; }

    input[type="text"], input[type="number"] {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"] { width: 200px; }
    input[type="number"] { width: 80px; }
    input:focus { border-color: #555; }

    .toggle-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .toggle-field label.title {
      font-size: 0.78rem;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
    }
    .toggle-wrap span { font-size: 0.9rem; color: #444; }

    input[type="checkbox"] {
      width: 36px; height: 20px;
      appearance: none;
      background: #ccc;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
    }
    input[type="checkbox"]::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      background: #fff;
      border-radius: 50%;
      top: 2px; left: 2px;
      transition: left 0.2s;
    }
    input[type="checkbox"]:checked { background: #1a1a1a; }
    input[type="checkbox"]:checked::after { left: 18px; }

    button {
      padding: 9px 24px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      height: 36px;
    }
    button:hover { background: #333; }
    button:disabled { background: #999; cursor: not-allowed; }

    .meta {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 16px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .badge.on  { background: #d4edda; color: #155724; }
    .badge.off { background: #f8d7da; color: #721c24; }

    .benchmarks {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .engine {
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
    }
    .engine-header {
      padding: 10px 14px;
      background: #f5f5f5;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .engine-name { font-weight: 700; font-size: 0.95rem; }
    .engine-time { font-size: 0.8rem; color: #888; }
    .engine-time.fast { color: #155724; font-weight: 600; }

    .engine-words {
      padding: 10px 14px;
      min-height: 60px;
    }
    .word-item {
      font-size: 0.9rem;
      padding: 3px 0;
      border-bottom: 1px solid #f0f0f0;
      font-family: "SF Mono", "Fira Code", monospace;
    }
    .word-item:last-child { border-bottom: none; }

    .empty { color: #aaa; font-size: 0.85rem; font-style: italic; }
    .error-msg { color: #721c24; font-size: 0.9rem; }
  </style>
</head>
<body>

<header>
  <h1>nearestword</h1>
  <p>Find dictionary words at a given edit distance. Benchmarks Go, C++, and Python — with and without trigram pre-filtering.</p>
</header>

<div class="card">
  <form class="form-row" id="search-form">
    <div class="field">
      <label for="word">Word</label>
      <input type="text" id="word" placeholder="e.g. amazing" value="amazing" required />
    </div>
    <div class="field">
      <label for="delta">Delta</label>
      <input type="number" id="delta" value="2" min="1" max="5" required />
    </div>
    <div class="field">
      <label for="limit">Limit</label>
      <input type="number" id="limit" value="10" min="1" max="50" required />
    </div>
    <div class="toggle-field">
      <label class="title">Trigram filter</label>
      <div class="toggle-wrap">
        <input type="checkbox" id="trgm" checked />
        <span id="trgm-label">on</span>
      </div>
    </div>
    <button type="submit" id="search-btn">Search</button>
  </form>
</div>

<div class="card" id="results" style="display:none"></div>

<script>
  const trgmBox = document.getElementById('trgm');
  const trgmLabel = document.getElementById('trgm-label');
  trgmBox.addEventListener('change', () => {
    trgmLabel.textContent = trgmBox.checked ? 'on' : 'off';
  });

  document.getElementById('search-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('search-btn');
    const resultsEl = document.getElementById('results');

    btn.disabled = true;
    btn.textContent = 'Searching…';
    resultsEl.style.display = 'none';

    const body = {
      word:  document.getElementById('word').value.trim(),
      delta: parseInt(document.getElementById('delta').value),
      limit: parseInt(document.getElementById('limit').value),
      trgm:  trgmBox.checked,
    };

    try {
      const res = await fetch('/api/search/all', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      renderResults(data);
    } catch (err) {
      resultsEl.innerHTML = `<p class="error-msg">Request failed: ${err.message}</p>`;
      resultsEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Search';
    }
  });

  function renderResults(data) {
    const resultsEl = document.getElementById('results');
    const trgmBadge = data.trgm_enabled
      ? '<span class="badge on">trgm on</span>'
      : '<span class="badge off">trgm off</span>';

    const engines = [
      { key: 'go',     label: 'Go' },
      { key: 'cpp',    label: 'C++' },
      { key: 'python', label: 'Python' },
    ];

    const cols = engines.map(({ key, label }) => {
      const e = data.benchmarks[key];
      const timeClass = e.duration_ms < 5 ? 'fast' : '';
      const words = e.results.length
        ? e.results.map(w => `<div class="word-item">${w}</div>`).join('')
        : '<div class="empty">no results</div>';
      return `
        <div class="engine">
          <div class="engine-header">
            <span class="engine-name">${label}</span>
            <span class="engine-time ${timeClass}">${e.duration_ms}ms</span>
          </div>
          <div class="engine-words">${words}</div>
        </div>`;
    }).join('');

    resultsEl.innerHTML = `
      <div class="meta">
        ${trgmBadge}
        <span>${data.candidates_scanned.toLocaleString()} candidates scanned</span>
      </div>
      <div class="benchmarks">${cols}</div>`;
    resultsEl.style.display = 'block';
  }
</script>
</body>
</html>
